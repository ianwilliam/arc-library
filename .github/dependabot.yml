version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["typescript", "eslint", "eslint-config-next", "@types/node"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
